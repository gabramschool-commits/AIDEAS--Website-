<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Driven Healthcare Research Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');

        /* Global Styles */
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            color: #333;
        }

        /* Layout */
        .dashboard-container {
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background-color: #2c3e50;
            color: white;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
        }

        .sidebar .logo {
            font-size: 24px;
            font-weight: 700;
            text-decoration: none;
            color: #ecf0f1;
            display: block;
            margin-bottom: 30px;
        }

        .sidebar-nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar-nav li {
            margin-bottom: 10px;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            text-decoration: none;
            color: #bdc3c7;
            border-radius: 5px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .sidebar-nav a:hover, .sidebar-nav a.active {
            background-color: #34495e;
            color: #ecf0f1;
        }

        /* Main Content Area */
        .main-content {
            margin-left: 250px;
            flex-grow: 1;
            padding: 40px;
        }

        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .main-header h1 {
            font-size: 32px;
            font-weight: 500;
            color: #2c3e50;
        }

        .user-profile {
            display: flex;
            align-items: center;
        }

        .user-profile span {
            margin-right: 10px;
            font-weight: 500;
        }

        .user-profile img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }

        /* Dashboard Cards */
        .dashboard-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background-color: white;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .card .metric-label {
            font-size: 16px;
            color: #7f8c8d;
            margin-bottom: 5px;
        }

        .card .metric-value {
            font-size: 36px;
            font-weight: 700;
            color: #2c3e50;
        }

        /* Charts Section */
        .chart-section {
            background-color: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 40px;
        }

        .chart-section h2 {
            font-size: 24px;
            font-weight: 500;
            margin-top: 0;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        /* Placeholder for charts (you would replace this with actual chart libraries like Chart.js or D3.js) */
        .chart-placeholder {
            height: 300px;
            background-color: #ecf0f1;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #7f8c8d;
        }

        /* Button */
        .btn-download {
            display: block;
            width: fit-content;
            margin: 0 auto;
            padding: 15px 30px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 500;
            transition: background-color 0.3s ease;
        }

        .btn-download:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        
        <aside class="sidebar">
            <a href="#" class="logo">AI-Driven Research</a>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="#" class="active">Dashboard</a></li>
                    <li><a href="#">Patients</a></li>
                    <li><a href="#">Reports</a></li>
                    <li><a href="#">Settings</a></li>
                    <li><a href="#">Logout</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <header class="main-header">
                <h1>Research Dashboard</h1>
                <div class="user-profile">
                    <span>Admin</span>
                    <img src="https://via.placeholder.com/40" alt="User Avatar">
                </div>
            </header>

            <section class="dashboard-cards">
                <div class="card">
                    <div class="metric-label">Total Records</div>
                    <div class="metric-value">120,000</div>
                </div>
                <div class="card">
                    <div class="metric-label">Regions Covered</div>
                    <div class="metric-value">15</div>
                </div>
                <div class="card">
                    <div class="metric-label">Last Update</div>
                    <div class="metric-value">Sept 2025</div>
                </div>
            </section>

            <section class="chart-section">
                <h2>Patients per Month</h2>
                <div class="chart-placeholder">
                    [Placeholder for line chart]
                </div>
            </section>

            <section class="chart-section">
                <h2>Common Diagnoses (%)</h2>
                <div class="chart-placeholder">
                    [Placeholder for bar chart]
                </div>
            </section>

            <a href="#" class="btn-download">Download CSV Data</a>

        </main>
    </div>

</body>
</html>
